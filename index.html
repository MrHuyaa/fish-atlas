<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长江流域淡水鱼图鉴</title>
<style>
:root{--bg:#f1f7f9;--card:#fff;--ink:#1b3641;--muted:#6c8792;--line:#dbe9ee;
--accent:#1b6b8a;--soft:#e3f1f6;--shadow:0 6px 28px rgba(27,107,138,.10)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
 display:flex;flex-direction:column;min-height:100vh}
header{padding:18px 28px 12px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:23px;letter-spacing:3px;font-weight:700}
header .sub{font-size:13px;color:var(--muted)}
header .count{margin-left:auto;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:1px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);
 gap:24px;padding:6px 28px 20px;align-items:center;min-height:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;
 background:var(--card);border:1px solid var(--line);border-radius:16px;
 box-shadow:var(--shadow);padding:16px 62px;min-height:0;overflow:hidden}
.photo{width:100%;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;max-width:860px;height:auto;max-height:min(62vh,620px);
 object-fit:contain;border-radius:10px;display:block;background:#eef4f6;
 cursor:zoom-in;animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:scale(1)}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;
 border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--accent);
 font-size:30px;line-height:1;border-radius:10px;cursor:pointer;transition:.15s;z-index:2}
.nav:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav.prev{left:10px}.nav.next{right:10px}
.stage .tip{position:absolute;bottom:10px;left:0;right:0;text-align:center;
 font-size:11px;color:var(--muted);pointer-events:none}
.info{background:var(--card);border:1px solid var(--line);border-radius:16px;
 box-shadow:var(--shadow);padding:26px 28px;max-height:min(66vh,660px);overflow:auto}
.no{font-size:12px;color:var(--accent);letter-spacing:2px;font-weight:600}
.info h2{margin:8px 0 6px;font-size:34px;letter-spacing:4px;font-weight:700}
.alias{font-size:14px;color:var(--muted);margin-bottom:12px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--accent)}
.tag.latin{background:#f2f5f6;color:var(--muted);font-style:italic}
.desc{font-size:15px;line-height:1.95;color:#314b56;margin:0 0 20px;text-align:justify}
.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trait{background:#f7fbfc;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.trait b{display:block;font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:5px}
.trait span{font-size:12px;line-height:1.55;color:#415c66}
.note{margin-top:16px;padding:10px 12px;border-left:3px solid #d9a441;
 background:#fdf8ec;border-radius:0 8px 8px 0;font-size:12px;line-height:1.7;color:#7a5b16}
.strip{border-top:1px solid var(--line);background:var(--card);padding:10px 28px 14px}
.strip .stitle{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.thumbs{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 8px;
 scroll-behavior:smooth;scrollbar-width:thin}
.thumbs::-webkit-scrollbar{height:6px}
.thumbs::-webkit-scrollbar-thumb{background:#c8dce3;border-radius:3px}
.thumb{flex:0 0 124px;border:2px solid transparent;border-radius:9px;overflow:hidden;
 cursor:pointer;background:#f5fafb;transition:.18s;text-align:center}
.thumb:hover{border-color:#9fc6d5;transform:translateY(-2px)}
.thumb.on{border-color:var(--accent);box-shadow:0 3px 12px rgba(27,107,138,.22)}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.thumb div{font-size:12px;padding:4px 2px;color:var(--muted);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.thumb.on div{color:var(--accent);font-weight:600}
#lb{position:fixed;inset:0;background:rgba(12,28,35,.9);display:none;
 align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:26px}
#lb img{max-width:100%;max-height:90vh;border-radius:10px;box-shadow:0 10px 50px rgba(0,0,0,.5)}
#lb span{position:absolute;top:18px;right:26px;color:#fff;font-size:13px}
@media(max-width:900px){
 header{padding:14px 14px 8px}h1{font-size:20px}
 main{grid-template-columns:1fr;gap:14px;padding:4px 14px 14px}
 .stage{padding:12px 50px}.photo img{max-height:44vh}
 .info{max-height:none;padding:18px}.info h2{font-size:27px}
 .strip{padding:8px 14px 12px}.thumb{flex-basis:100px}
}
</style>
</head>

let cur = 0;
const $ = id => document.getElementById(id);
const enc = p => encodeURI(p).replace(/#/g,'%23');

function buildThumbs(){
  $('thumbs').innerHTML = FISH.map((f,i) =>
    '<div class="thumb" data-i="'+i+'"><img loading="lazy" src="'+enc(f.thumb)+'" alt="'+f.name+'">'+
    '<div>'+String(i+1).padStart(2,'0')+' '+f.name+'</div></div>').join('');
}
function show(i, scroll=true){
  cur = (i + FISH.length) % FISH.length;
  const f = FISH[cur];
  const img = $('mainImg');
  img.src = enc(f.img); img.alt = f.name;
  img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
  $('count').textContent = String(cur+1).padStart(2,'0') + ' / ' + String(FISH.length).padStart(2,'0');
  $('no').textContent = 'NO.' + String(cur+1).padStart(2,'0');
  $('name').textContent = f.name;
  $('alias').textContent = f.alias;
  $('meta').innerHTML = '<span class="tag">'+f.family+'</span><span class="tag latin">'+f.latin+'</span>';
  $('desc').textContent = f.desc;
  $('traits').innerHTML = f.traits.map(t =>
    '<div class="trait"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>').join('');
  $('noteBox').innerHTML = f.note ? '<div class="note">'+f.note+'</div>' : '';
  document.querySelectorAll('.thumb').forEach((el,k) => el.classList.toggle('on', k===cur));
  if (scroll){
    const el = document.querySelectorAll('.thumb')[cur];
    if (el) el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }
}
$('prev').addEventListener('click', () => show(cur-1));
$('next').addEventListener('click', () => show(cur+1));
$('thumbs').addEventListener('click', e => {
  const t = e.target.closest('.thumb'); if (t) show(+t.dataset.i, false);
});
$('thumbs').addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    $('thumbs').scrollLeft += e.deltaY; e.preventDefault();
  }
}, {passive:false});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(cur-1);
  else if (e.key === 'ArrowRight') show(cur+1);
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(FISH.length-1);
  else if (e.key === 'Escape'){ $('lb').style.display='none'; $('lbimg').src=''; }
});
let tx = 0, ty = 0;
$('mainImg').addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
$('mainImg').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
}, {passive:true});
const lb = $('lb'), lbimg = $('lbimg');
$('mainImg').addEventListener('click', () => { lbimg.src = $('mainImg').src; lb.style.display='flex'; });
lb.addEventListener('click', () => { lb.style.display='none'; lbimg.src=''; });

buildThumbs();
show(0, false);
</script>
